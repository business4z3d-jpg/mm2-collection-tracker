[build]
  publish = "site"
  command = ""
  # value updates are read straight from GitHub, so commits that only touch them need no new deploy
  ignore = "git diff --quiet $CACHED_COMMIT_REF $COMMIT_REF -- . ':(exclude)site/values.json' ':(exclude)site/history.json'"

[[headers]]
  for = "/*.json"
  [headers.values]
    Access-Control-Allow-Origin = "*"
    Cache-Control = "public, max-age=300"
